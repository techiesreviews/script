<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Script editor · script.techies.tools</title>
<meta name="description" content="A simple, clean editor for video scripts. Your own AI agent suggests changes, and your script stays a file on your computer.">
<link rel="canonical" href="https://script.techies.tools/">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="together/carets.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="doc" id="docInfo" hidden>
      <button class="doc__switch" id="docSwitch" type="button" popovertarget="scriptMenu"><span class="doc__title"><span class="doc__name" id="fileName"></span><span data-icon="chevron"></span></span><span class="doc__meta" id="docMeta"></span></button>
      <span class="doc__state"><span class="save-state" id="saveState"></span><button class="allow-save" id="allowSave" type="button" hidden></button></span>
    </div>
    <div class="menu menu--scripts" id="scriptMenu" popover>
      <input class="menu__search" id="scriptSearch" type="search" placeholder="Search scripts" aria-label="Search scripts" autocomplete="off" spellcheck="false">
      <ul class="scripts" id="scriptList" aria-label="Recent scripts"></ul>
      <div class="menu__divider"></div>
      <button class="menu-action" id="menuOpen" type="button"><span data-icon="open"></span><span class="menu-action__text">Open a script…</span></button>
      <button class="menu-action" id="menuNew" type="button"><span data-icon="plus"></span><span class="menu-action__text">New script</span></button>
    </div>
    <div class="view-switch" id="viewSwitch" role="group" aria-label="View" hidden>
      <button type="button" data-view="script" aria-pressed="true" aria-label="Script"><span data-icon="doc"></span><span class="lbl">Script</span></button>
      <button type="button" data-view="board" aria-pressed="false" aria-label="Storyboard"><span data-icon="board"></span><span class="lbl">Storyboard</span></button>
    </div>
    <div class="top__end">
      <div class="people" id="people" role="group" aria-label="People in this script" hidden></div>
      <button class="tb voice-btn" id="voiceBtn" type="button" disabled hidden><span data-icon="wave"></span><span class="lbl">Sounds like me</span><span class="status-dot"></span><span class="count" id="voiceCount" hidden>0</span></button>
      <button class="tb agent-btn" id="agentBtn" type="button" hidden popovertarget="agentMenu" data-state="off"><span class="status-dot"></span><span data-icon="plug"></span><span class="lbl" id="agentBtnLabel">Connect your agent</span></button>
      <div class="menu menu--agent" id="agentMenu" popover>
        <ul class="menu__agents" id="agentRows"></ul>
        <div class="menu__divider"></div>
        <div class="menu-row" id="voiceGuideRow"><span data-icon="wave"></span><span class="menu-row__text" id="voiceGuideText">Voice guide · <span id="voiceGuideName">none</span></span><button class="small-btn" type="button" id="voiceGuideOpen">Open…</button><button class="icon-btn" type="button" id="voiceGuideClear" aria-label="Remove the voice guide" hidden data-icon="x"></button></div>
        <div class="menu__divider"></div>
        <button class="menu-action" id="mcpAction" type="button" data-state="off"><span class="status-dot"></span><span class="menu-action__text" id="mcpActionText" aria-live="polite">Wait for MCP</span><span class="menu-action__copy" id="mcpCopy" aria-hidden="true" data-icon="copy"></span></button>
        <textarea class="menu__prompt" id="mcpPrompt" readonly hidden aria-label="Connection prompt"></textarea>
      </div>
      <button class="tb tb--ink" id="exportBtn" type="button" hidden popovertarget="exportMenu"><span data-icon="export"></span><span class="lbl">Export</span></button>
      <div class="menu menu--export" id="exportMenu" popover>
        <div class="menu__group" role="group" aria-labelledby="exportA">
          <p class="menu__head" id="exportA">A-roll</p>
          <button class="menu-action" type="button" data-export="camera"><span data-icon="camera"></span><span class="menu-action__text">Camera script (.txt)</span></button>
          <button class="menu-action" type="button" data-export="prompter-open" id="prompterAction"><span data-icon="prompter"></span><span class="menu-action__text">Open in prompter<span class="menu-action__note" id="prompterNote" hidden>Too long for the prompter</span></span></button>
          <button class="menu-action" type="button" data-export="prompter"><span data-icon="download"></span><span class="menu-action__text">Prompter (.md)</span></button>
          <button class="menu-action" type="button" data-export="markdown" id="saveAsAction" hidden><span data-icon="save"></span><span class="menu-action__text">Markdown file (.md)</span></button>
        </div>
        <div class="menu__group" role="group" aria-labelledby="exportB">
          <p class="menu__head" id="exportB">B-roll</p>
          <button class="menu-action" type="button" data-export="broll" disabled><span data-icon="film"></span><span class="menu-action__text">B-roll list (.md)<span class="menu-action__note" data-note="broll">Link a B-roll list first</span></span></button>
        </div>
        <div class="menu__group" role="group" aria-labelledby="exportS">
          <p class="menu__head" id="exportS">Storyboard</p>
          <button class="menu-action" type="button" data-export="storyboard" disabled><span data-icon="board"></span><span class="menu-action__text">Storyboard (.html)<span class="menu-action__note" data-note="broll">Link a B-roll list first</span></span></button>
        </div>
      </div>
      <div class="share" id="share" hidden>
        <button class="tb tb--ink" id="shareBtn" type="button"><span class="share__icon" id="shareIcon"></span><span class="lbl" id="shareLabel">Share to edit</span></button>
        <button class="tb tb--icon" id="stopShare" type="button" aria-label="Stop sharing" title="Stop sharing" hidden data-icon="x"></button>
      </div>
      <div class="menu menu--share" id="shareMenu" popover><input class="menu__link" id="shareLink" type="text" readonly aria-label="Edit link"></div>
    </div>
  </header>

  <main class="empty" id="empty">
    <div class="empty__actions">
      <p class="banner empty__note" id="emptyNote" role="status" hidden></p>
      <button class="tb tb--ink tb--big" type="button" id="emptyOpen"><span data-icon="open"></span>Open a script</button>
      <button class="tb tb--big" type="button" id="emptyNew"><span data-icon="plus"></span>New script</button>
      <button class="tb tb--big" type="button" id="emptySample"><span data-icon="prompter"></span>Try a demo script</button>
      <button class="tb tb--big" type="button" id="emptyReopen" hidden><span data-icon="undo"></span><span id="reopenLabel">Reopen</span></button>
      <form class="join" id="joinForm" hidden>
        <input id="joinName" type="text" placeholder="Your name" aria-label="Your name" autocomplete="nickname" maxlength="40" spellcheck="false" enterkeyhint="go">
        <button class="tb tb--ink tb--big" type="submit">Join</button>
      </form>
    </div>
  </main>

  <div class="layout" id="layout" hidden>
    <aside class="side">
      <nav class="toc" aria-label="Sections"><ol id="toc"></ol></nav>
    </aside>
    <main class="paper">
      <div class="sheet">
        <div class="banner" id="banner" role="status" hidden></div>
        <div class="script" id="script"></div>
      </div>
      <section class="board" id="board" aria-label="Storyboard" hidden></section>
    </main>
  </div>
</div>

<div class="edit-bar" id="editBar" role="toolbar" aria-label="Edit selection" hidden>
  <span class="edit-bar__label" id="ebLabel">0 words</span>
  <div class="edit-bar__controls">
    <button class="edit-bar__button" type="button" data-act="shorter"></button>
    <button class="edit-bar__button" type="button" data-act="simpler"></button>
    <button class="edit-bar__button edit-bar__button--voice" type="button" data-act="like"></button>
    <button class="edit-bar__button" type="button" id="moreBtn" popovertarget="moreMenu" aria-haspopup="menu" aria-expanded="false">More<span data-icon="chevron"></span></button>
    <div class="menu bar-menu" id="moreMenu" role="menu" aria-labelledby="moreBtn" popover>
      <button class="menu-action" type="button" role="menuitem" data-act="explain"></button>
      <button class="menu-action" type="button" role="menuitem" data-act="facts"></button>
    </div>
    <button class="edit-bar__button" type="button" id="brollBtn" popovertarget="brollMenu" aria-haspopup="menu" aria-expanded="false"><span data-icon="film"></span>B-roll<span data-icon="chevron"></span></button>
    <div class="menu bar-menu" id="brollMenu" role="menu" aria-labelledby="brollBtn" popover>
      <button class="menu-action" type="button" role="menuitem" id="addBroll"><span data-icon="film"></span>Add B-roll…</button>
      <button class="menu-action" type="button" role="menuitem" data-act="broll"></button>
    </div>
    <button class="edit-bar__button" type="button" data-act="broll" id="suggestBroll" hidden></button>
    <form class="edit-bar__ask" id="askForm"><input id="askInput" type="text" placeholder="Ask…" aria-label="Ask about this selection" autocomplete="off" maxlength="500"><button type="submit" aria-label="Send" data-icon="send"></button></form>
  </div>
</div>

<div class="slash-menu" id="slashMenu" role="listbox" aria-label="Parts" hidden></div>

<div class="voice-card" id="voiceCard" role="dialog" aria-label="Sounds like me" hidden>
  <p class="voice-card__why" id="vcWhy"></p>
  <p class="voice-card__try" id="vcTry"></p>
  <div class="voice-card__actions"><button class="small-btn" type="button" id="vcKeep">Keep mine</button><button class="small-btn use" type="button" id="vcUse">Use this</button></div>
</div>


<form class="voice-card shot-card" id="shotCard" role="dialog" aria-labelledby="scTitle" hidden novalidate>
  <p class="shot-card__title" id="scTitle">Add B-roll</p>
  <div class="shot-card__kinds" id="scKind" role="group" aria-label="Kind">
    <button type="button" data-kind="broll" aria-pressed="true">B-roll</button>
    <button type="button" data-kind="motion" aria-pressed="false">Motion plate</button>
    <button type="button" data-kind="screen" aria-pressed="false">Screen recording</button>
  </div>
  <label class="shot-card__field"><span>What to show</span><textarea id="scWhat" rows="2" maxlength="200" required autocomplete="off"></textarea></label>
  <label class="shot-card__field" id="scHowField"><span>How to make it</span><input id="scHow" type="text" maxlength="120" autocomplete="off"></label>
  <p class="shot-card__problem" id="scProblem" hidden>Not saved</p>
  <div class="voice-card__actions"><button class="small-btn shot-card__remove" type="button" id="scRemove" hidden>Remove shot</button><button class="small-btn" type="button" id="scCancel">Cancel</button><button class="small-btn use" type="submit" id="scSave">Add</button></div>
</form>

<input type="file" id="fileInput" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
<input type="file" id="brollInput" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
<input type="file" id="voiceGuideInput" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
</body>
</html>
